<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hanbok Go</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style id="gate-css">
  html,body{margin:0;height:100%;background:#f7f0e1;font-family:'Nunito',system-ui,sans-serif;color:#4a3b32}
  #gate{min-height:100%;display:grid;place-items:center;padding:20px;box-sizing:border-box}
  #gate form{width:100%;max-width:340px;background:#fffaf1;border:2px solid #eadfce;border-radius:28px;padding:26px 22px;box-shadow:0 12px 34px rgba(90,60,30,.18);text-align:center}
  #gate img{width:92px;height:92px;border-radius:22px}
  #gate h1{margin:10px 0 2px;font-size:24px;font-weight:800}
  #gate p{margin:0 0 16px;font-size:14px;color:#9b8a7c;font-weight:600}
  #gate input[type=text],#gate input[type=password]{display:block;width:100%;box-sizing:border-box;margin-bottom:10px;padding:13px 14px;border:2px solid #eadfce;border-radius:16px;font:inherit;font-size:16px;font-weight:600;background:#fff;color:inherit;outline:0}
  #gate input:focus{border-color:#e8554e}
  #gate label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;margin:4px 0 14px}
  #gate button{width:100%;padding:13px;border:2px solid #c9403a;border-radius:16px;background:#e8554e;color:#fff;font:inherit;font-size:17px;font-weight:800;box-shadow:0 3px 0 #c9403a;cursor:pointer}
  #gate button:disabled{opacity:.6}
  #gate .err{color:#c9403a;font-weight:800;font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<div id="gate">
  <form id="gate-form" autocomplete="on">
    <img src="icon.svg" alt="">
    <h1>Hanbok Go</h1>
    <p>Private preview — sign in to open the map.</p>
    <input id="g-id" type="text" placeholder="ID" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <input id="g-pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <label><input id="g-keep" type="checkbox" checked> Stay signed in on this device</label>
    <button id="g-go" type="submit">Open</button>
    <div class="err" id="g-err"></div>
  </form>
</div>
<script>
// The app itself is stored encrypted (app.enc.json). The ID and password are never sent anywhere:
// they are turned into a key in this browser, and only the right key can decrypt the app.
(function () {
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var toB64 = function (u) { var s = ''; u.forEach(function (c) { s += String.fromCharCode(c); }); return btoa(s); };
  var enc = null;
  var $ = function (id) { return document.getElementById(id); };

  function getEnc() { return enc ? Promise.resolve(enc) : fetch('app.enc.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { enc = j; return j; }); }

  async function deriveKey(id, pw, e) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(id.trim().toLowerCase() + ':' + pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(e.salt), iterations: e.iter, hash: 'SHA-256' }, base, 512));
  }
  async function decrypt(e, kb) {
    var iv = b64(e.iv), ct = b64(e.ct), msg = new Uint8Array(iv.length + ct.length);
    msg.set(iv); msg.set(ct, iv.length);
    var macKey = await crypto.subtle.importKey('raw', kb.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    if (!(await crypto.subtle.verify('HMAC', macKey, b64(e.mac), msg))) throw new Error('bad key');
    var aes = await crypto.subtle.importKey('raw', kb.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, aes, ct)));
  }
  function loadScript(src) { return new Promise(function (ok, fail) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }); }

  async function boot(app) {
    $('gate-css').remove();
    var st = document.createElement('style'); st.textContent = app.css; document.head.appendChild(st);
    document.title = app.title;
    document.body.innerHTML = app.body;
    await loadScript('vendor/maplibre-gl.js');
    app.scripts.forEach(function (code) { var s = document.createElement('script'); s.textContent = code; document.body.appendChild(s); });
  }

  async function tryStored() {
    try {
      var saved = JSON.parse(localStorage.getItem('hg_key') || 'null');
      if (!saved) return false;
      var e = await getEnc();
      if (saved.salt !== e.salt) { localStorage.removeItem('hg_key'); return false; }
      await boot(await decrypt(e, b64(saved.k)));
      return true;
    } catch (x) { try { localStorage.removeItem('hg_key'); } catch (y) {} return false; }
  }

  $('gate-form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var btn = $('g-go'), err = $('g-err');
    btn.disabled = true; err.textContent = ''; btn.textContent = 'Opening…';
    try {
      var e = await getEnc();
      var kb = await deriveKey($('g-id').value, $('g-pw').value, e);
      var app = await decrypt(e, kb);
      if ($('g-keep').checked) { try { localStorage.setItem('hg_key', JSON.stringify({ salt: e.salt, k: toB64(kb) })); } catch (x) {} }
      await boot(app);
    } catch (x) {
      btn.disabled = false; btn.textContent = 'Open';
      err.textContent = x && x.message === 'bad key' ? 'Wrong ID or password.' : 'Could not open. Check your connection and try again.';
    }
  });

  if (!window.crypto || !crypto.subtle) { $('g-err').textContent = 'This page needs a secure (https) connection.'; return; }
  tryStored();
})();
</script>
</body>
</html>
